services:
  envoy:
    image: envoyproxy/envoy:v1.32-latest
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "8080:8080"                # traffic goes in here
      - "127.0.0.1:9901:9901"      # admin page, local access only
    depends_on:
      - backend-1
      - backend-2

  backend-1:
    build: ./backends
    environment:
      NAME: backend-1
    ports:
      - "8081:8080"   # direct access for testing; Envoy will reach it on the internal network

  backend-2:
    build: ./backends
    environment:
      NAME: backend-2
    ports:
      - "8082:8080"
